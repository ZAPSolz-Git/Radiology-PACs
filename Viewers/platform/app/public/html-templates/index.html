  <title>Armorray Viewer</title>

  <style>
    body {
      background-color: #000000;
      margin: 0;
    }

    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      z-index: 9999;
    }

    .logo-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .logo-container svg {
      position: absolute;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .logo-container circle {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
    }

    .circle-bg {
      stroke: rgba(255, 255, 255, 0.1);
    }

    .circle-progress {
      stroke: #00aaff;
      stroke-dasharray: 364.4;
      stroke-dashoffset: 364.4;
      animation: circular-loading 2s infinite ease-in-out;
    }

    @keyframes circular-loading {
      0% {
        stroke-dashoffset: 364.4;
        transform: rotate(-90deg);
      }

      50% {
        stroke-dashoffset: 91;
        transform: rotate(90deg);
      }

      100% {
        stroke-dashoffset: 364.4;
        transform: rotate(270deg);
      }
    }

    .logo-container img {
      width: 64px;
      height: auto;
      border-radius: 50%;
      border: 2px solid rgba(0, 170, 255, 0.2);
    }
  </style>

  <script>
    function browserImportFunction(moduleId) {

    window.PUBLIC_URL = '<%= PUBLIC_URL %>';
